pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
    plugins {
        id 'com.android.application' version '8.4.2'
        id 'org.jetbrains.kotlin.android' version '2.2.0'
    }
}

plugins {
    // Toolchain resolver convention that allows Gradle to auto-provision JDKs (Foojay resolver)
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// The Foojay resolver convention plugin is applied above; it configures toolchain
// download repositories automatically so we don't add duplicate entries here.

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://jitpack.io"
        }
    }
}
include ':app'
