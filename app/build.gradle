import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = 'com.ld.tageditor'
    compileSdk = 33

    defaultConfig {
        applicationId = "com.ld.tageditor"
        minSdk = 20
        targetSdk = 33
        versionCode 1
        versionName "1.1"

        vectorDrawables {
            useSupportLibrary = true
        }

        def commit = 'git rev-parse --short HEAD'.execute().text.trim()
        buildConfigField("String", "COMMIT", "\""+commit+"\"")
    }

    buildFeatures {
        buildConfig = true
    }

    splits {
        abi {
            enable = true
            reset()
            universalApk true
        }
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            initWith release
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    signingConfigs {
        debug {
            // Use local Windows keystore path if available
            try {
                def keystoreProps = new Properties()
                keystoreProps.load(new FileInputStream(rootProject.file("keystore.properties")))
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            } catch (ignored) {
                storeFile file('C:/Users/hamil/.keystore')
                storePassword '19monkeys'
                keyAlias 'key0'
                keyPassword '19monkeys'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
        jvmToolchain(17)
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'androidx.webkit:webkit:1.4.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.0"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
}